{% extends 'base.html' %}

{% block title %}Tambah Pembimbing - SIGMA BGTK Sumbar{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-7">
        <div class="card-custom p-4">
            <h5 class="fw-bold mb-3"><i class="fa-solid fa-user-tie text-primary me-2"></i>Tambah Akun Pembimbing</h5>
            <form method="POST">
                {% csrf_token %}
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Nama Lengkap <span class="text-danger">*</span></label>
                        <input type="text" name="full_name" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Nomor HP</label>
                        <input type="text" name="no_hp" class="form-control">
                    </div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                    <input type="password" name="password" class="form-control" minlength="8" required>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'pembimbing_list' %}" class="btn btn-secondary">Batal</a>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk me-1"></i> Simpan Pembimbing</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
