{% extends 'base.html' %}

{% block title %}Ganti Password - SIGMA BGTK Sumbar{% endblock %}

{% block content %}
<div class="row justify-content-center"><div class="col-12 col-md-6"><div class="card-custom p-4">
    <h5 class="fw-bold mb-3"><i class="fa-solid fa-key text-primary me-2"></i> Ganti Password</h5>
    {% if messages %}{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}{% endif %}
    <form method="POST">{% csrf_token %}
        <div class="mb-3"><label class="form-label fw-semibold">Password Saat Ini</label><input type="password" name="current_password" class="form-control" required></div>
        <div class="mb-3"><label class="form-label fw-semibold">Password Baru</label><input type="password" name="new_password" class="form-control" minlength="8" required></div>
        <div class="mb-4"><label class="form-label fw-semibold">Konfirmasi Password Baru</label><input type="password" name="confirm_password" class="form-control" minlength="8" required></div>
        <div class="d-flex justify-content-end gap-2"><a href="{% url 'profile' %}" class="btn btn-secondary">Batal</a><button class="btn btn-primary" type="submit">Simpan Password</button></div>
    </form>
</div></div></div>
{% endblock %}
