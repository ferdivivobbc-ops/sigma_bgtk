{% extends 'base.html' %}

{% block title %}Konfirmasi Hapus Kampus{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6">
        <div class="card-custom p-4 text-center">
            <i class="fa-solid fa-triangle-exclamation text-warning fa-3x mb-3"></i>
            <h5 class="fw-bold text-dark">Hapus Data Kampus?</h5>
            <p class="text-muted">Apakah Anda yakin ingin menghapus data kampus <strong>{{ kampus.nama_kampus }}</strong>?</p>
            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2 mt-4">
                    <a href="{% url 'kampus_list' %}" class="btn btn-secondary">Batal</a>
                    <button type="submit" class="btn btn-danger"><i class="fa-solid fa-trash me-1"></i> Ya, Hapus Kampus</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
